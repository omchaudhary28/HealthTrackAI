<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MindTrack AI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MindTrack AI is a privacy-first mental wellness support platform for reflection, habit building, and progress tracking."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Bangers&family=Manrope:wght@500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }

      #app-bootstrap-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #fff6ef 0%, #f1f7ff 42%, #eefdf6 100%);
        color: #0f172a;
        font-family: "Baloo 2", "Manrope", sans-serif;
        transition: opacity 0.28s ease, visibility 0.28s ease;
      }

      body.app-bootstrap-ready #app-bootstrap-fallback {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #app-bootstrap-fallback[data-state="error"] {
        background: linear-gradient(135deg, #fff8f6 0%, #fff6fb 50%, #fffdf8 100%);
      }

      #app-bootstrap-fallback[data-state="error"] .boot-spinner {
        display: none;
      }

      #app-bootstrap-fallback[data-state="loading"] .boot-actions {
        display: none;
      }

      #app-bootstrap-fallback[data-state="error"] .boot-chip {
        background: rgba(225, 29, 72, 0.12);
        color: #be123c;
      }

      .boot-panel {
        width: min(100%, 28rem);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 28px 60px -36px rgba(15, 23, 42, 0.35);
        padding: 32px 28px;
      }

      .boot-chip {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: rgba(2, 132, 199, 0.12);
        color: #075985;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .boot-title {
        margin: 18px 0 10px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .boot-message {
        margin: 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.7;
      }

      .boot-spinner {
        margin-top: 22px;
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 3px solid rgba(14, 165, 233, 0.16);
        border-top-color: #0ea5e9;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-actions {
        margin-top: 22px;
      }

      .boot-reload {
        border: none;
        border-radius: 999px;
        background: #0f172a;
        color: #ffffff;
        cursor: pointer;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
      }

      .boot-note {
        margin-top: 18px;
        color: #64748b;
        font-size: 12px;
        line-height: 1.6;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-bootstrap-fallback" data-state="loading" aria-live="polite">
      <div class="boot-panel">
        <div class="boot-chip">Starting MindTrack</div>
        <h1 id="app-bootstrap-title" class="boot-title">Loading your workspace</h1>
        <p id="app-bootstrap-message" class="boot-message">
          MindTrack is restoring your session and preparing the latest interface.
        </p>
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-actions">
          <button type="button" class="boot-reload" onclick="window.location.reload()">Reload app</button>
        </div>
        <div class="boot-note">If the app keeps hanging here, a stale cache or blocked browser storage is the usual cause.</div>
      </div>
    </div>
    <app-root></app-root>
    <noscript>
      <div class="boot-panel" style="margin: 24px auto;">
        <div class="boot-chip">JavaScript Required</div>
        <h1 class="boot-title">MindTrack needs JavaScript to render.</h1>
        <p class="boot-message">Enable JavaScript in this browser and reload the page.</p>
      </div>
    </noscript>
  </body>
</html>
