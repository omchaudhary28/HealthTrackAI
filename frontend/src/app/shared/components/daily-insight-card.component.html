<div class="mt-card mt-card-hover p-5 sm:p-6">
  <div class="mt-card-head flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div class="mt-card-brand min-w-0">
      <div class="mt-card-icon">
        <app-icon name="insights" className="text-lg"></app-icon>
      </div>
      <div class="min-w-0">
        <div class="mt-card-kicker">Daily insight</div>
        <div class="mt-2 text-xl font-semibold text-slate-950 sm:text-2xl">Quick reset before the scroll starts.</div>
        <div class="mt-card-copy mt-2 text-sm">Pick the nearest vibe and use the prompt if you want a cleaner next step.</div>
      </div>
    </div>

    <a routerLink="/journal" class="btn-primary rounded-2xl px-4 py-3 text-sm font-semibold">
      Open journal
    </a>
  </div>

  <div class="mt-5 grid gap-3 sm:grid-cols-5">
    <button
      *ngFor="let mood of moodOptions"
      type="button"
      (click)="selectMood(mood)"
      [attr.aria-pressed]="selectedMood() === mood.id"
      [ngClass]="buttonClass(mood)"
      class="mt-card-soft mt-card-hover flex min-h-[5.5rem] items-center gap-3 rounded-[1.35rem] border px-4 py-3 text-left text-sm font-semibold transition focus-visible:outline-none">
      <div class="mt-card-icon h-10 w-10 rounded-[0.85rem]">
        <app-icon [name]="mood.icon" className="text-sm"></app-icon>
      </div>
      <span>{{ mood.label }}</span>
    </button>
  </div>

  <div class="mt-card-soft mt-5 p-4">
    <div class="mt-card-brand">
      <div class="mt-card-icon h-11 w-11 rounded-[0.95rem]">
        <app-icon name="wand" className="text-base"></app-icon>
      </div>
      <div class="min-w-0">
        <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Quick note</div>
        <div class="mt-2 text-sm leading-7 text-slate-700">
          {{ currentInsight() }}
        </div>
      </div>
    </div>
  </div>
</div>
