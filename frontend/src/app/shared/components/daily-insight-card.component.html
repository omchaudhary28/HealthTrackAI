<div class="rounded-[2.5rem] border border-white/70 bg-gradient-to-br from-blue-50 to-emerald-50 p-6 shadow-[0_25px_70px_-45px_rgba(32,50,71,0.45)]">
  <div class="space-y-5 rounded-2xl bg-white p-6 shadow-lg">
    <div>
      <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Mood check</div>
      <div class="mt-4 flex flex-wrap gap-3">
        <button
          *ngFor="let mood of moodOptions"
          type="button"
          (click)="selectMood(mood)"
          [attr.aria-pressed]="selectedMood() === mood.id"
          [ngClass]="buttonClass(mood)"
          class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold transition hover:scale-105 hover:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-300">
          <span class="text-lg">{{ mood.emoji }}</span>
          <span>{{ mood.label }}</span>
        </button>
      </div>
    </div>

    <div>
      <div class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Quick note</div>
      <div class="mt-3 rounded-xl bg-blue-50 p-4 text-sm text-slate-700">
        {{ currentInsight() }}
      </div>
    </div>

    <div>
      <a
        routerLink="/journal"
        class="inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-blue-500 to-emerald-400 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:shadow-lg hover:scale-[1.02] active:scale-[0.98]">
        Journal now <span class="ml-2">&rarr;</span>
      </a>
    </div>
  </div>
</div>
