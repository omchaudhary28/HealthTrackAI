services:
  - type: web
    name: healthtrackai-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://healthtrackai-23752.web.app,https://healthtrackai-23752.firebaseapp.com
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
